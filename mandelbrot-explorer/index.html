<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Mandelbrot</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 10px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #userInputForm {
            display: flex;
            flex-direction: column;
        }

        #userInputForm label {
            margin: 2px;
        }

        #userInputForm button {
            margin: 2px;
        }
    </style>
</head>

<body>
    <div style="display: flex;">
        <div id="zooming">
            <button data-dir="in">+</button>
            <button data-dir="out">-</button>
        </div>
        <table>
            <tr>
                <!--<th>imgSize (w * h)</th> -->
                <!--<th>dataSize (kb)</th> -->
                <th>fps</th>
                <th>computeTime</th>
                <!-- <th>dataSum</th> -->
            </tr>
            <tr>
                <!--<td id="imgSize"></td> -->
                <!--<td id="dataSize"></td> -->
                <td id="fps"></td>
                <td id="computeTime"></td>
                <!--<td id="data"></td> -->
            </tr>
        </table>
        <div id="panning">
            <button data-dir="up">&uarr;</button>
            <div class="middle">
                <button data-dir="left">&larr;</button>
                <button data-dir="right">&rarr;</button>
            </div>
            <button data-dir="down">&darr;</button>
        </div>
    </div>
    <canvas id="mandelbrotCanvas" width="1024" height="1024"></canvas>
    <script src="gpu.js"></script>
    <script src="main.js"></script>

</body>

</html>
